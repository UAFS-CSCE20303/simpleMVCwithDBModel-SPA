<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management SPA</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar bg-body-tertiary mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">User Management SPA</span>
        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-4 bg-light p-3">
                <form id="addUserForm" novalidate>
                    <div class="form-group m-2">
                        <label for="fname">First Name</label>
                        <input type="text" class="form-control" id="fname" name="fname" required>
                        <div class="invalid-feedback">Please provide a first name.</div>
                    </div>
                    <div class="form-group m-2">
                        <label for="lname">Last Name</label>
                        <input type="text" class="form-control" id="lname" name="lname" required>
                        <div class="invalid-feedback">Please provide a last name.</div>
                    </div>
                    <div class="form-group m-2">
                        <label for="username">User Name</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                        <div class="invalid-feedback">Please provide a username.</div>
                    </div>
                    <div class="form-group m-2">
                        <label for="passwd">Password</label>
                        <input type="password" class="form-control" id="passwd" name="passwd" required minlength="6">
                        <div class="invalid-feedback">Password must be at least 6 characters long.</div>
                    </div>
                    <button type="submit" class="btn btn-primary m-2">Submit</button>
                </form>
            </div>
            <div class="col-8">
                <!-- Timestamp element added at the top of the list display -->
                <div id="lastRefreshedTime" class="text-muted small mb-2">Last updated: </div>

                <table class="table table-striped">
                    <thead>
                        <tr>
                            <!-- Table headers mapped from the users table columns -->
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>User Name</th>
                            <th>Password</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Dynamically populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Separate Client-Side JS File -->
    <script src="scripts/app.js"></script>
    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
